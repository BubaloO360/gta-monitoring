name: Monitor Portwatch VI

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:
    inputs:
      test_notification:
        description: "Enviar alerta de teste no Discord (não altera state.json)"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  check-progress:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run monitor script
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          TEST_NOTIFICATION: ${{ inputs.test_notification }}
        run: python3 monitor.py

      - name: Commit state changes
        run: |
          if ! git diff --quiet state.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add state.json
            git commit -m "Update notified progress milestones"
            git push
          fi
